## thalamo-cortical (TC)
## Parameters from Izhikevich (2003)

neuron:
  type: TC
  model: izhikevich
  parameters:
    a: 0.02
    b: 0.25
    c: -65   # unit: mV
    d: 0.05

stimulus:
  base: -10          # arbitrary units (dimensionless)
  components:
    - kind: step
      amplitude: 10  # arbitrary units (dimensionless, scaled to match Izhikevich paper)
      start_ms: 100
      duration_ms: 700


simulation:
  dt_ms: 0.01
  t_end_ms: 800
  integrator: rk4

