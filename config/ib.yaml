## intrinsically bursting (IB)
## Parameters from Izhikevich (2003)

neuron:
  type: IB
  model: izhikevich
  parameters:
    a: 0.02
    b: 0.2
    c: -55   # unit: mV
    d: 4

stimulus:
  base: 0
  components:
  - kind: step
    amplitude: 10      # dimension:t (changing with time)
    start_ms: 100
    duration_ms: 900

simulation:
  dt_ms: 0.01
  t_end_ms: 1000
  integrator: rk4
