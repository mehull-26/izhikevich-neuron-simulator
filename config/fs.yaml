## fast spiking (FS)
## Parameters from Izhikevich (2003)

neuron:
  type: FS
  model: izhikevich
  parameters:
    a: 0.1
    b: 0.2
    c: -65   # unit: mV
    d: 2

stimulus:
  base: 0
  components:
  - kind: step
    amplitude: 10      # arbitrary units (dimensionless, scaled to match Izhikevich paper)
    start_ms: 100
    duration_ms: 700

simulation:
  dt_ms: 0.01
  t_end_ms: 800
  integrator: rk4
