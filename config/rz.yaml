## resonator (RZ)
## Parameters from Izhikevich (2003)

neuron:
  type: RZ
  model: izhikevich
  parameters:
    a: 0.1
    b: 0.26
    c: -65   # unit: mV
    d: 2

stimulus:
  base: 0
  components:
  - kind: step
    amplitude: 0.2     # arbitrary units (adjusted for resonator behavior)
    start_ms: 200
    duration_ms: 600

  - kind: step
    amplitude: 0.6     # arbitrary units
    start_ms: 300
    duration_ms: 2

simulation:
  dt_ms: 0.01
  t_end_ms: 800
  integrator: euler
